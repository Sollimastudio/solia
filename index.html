<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol.IA - Assessora de Influência</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#D4AF37"/>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #D4AF37;
            border-radius: 20px;
            border: 2px solid #1a1a1a;
        }
        .solia-glow {
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.7);
        }
    </style>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen">
    <div class="w-full h-full sm:max-w-2xl sm:h-[90vh] sm:max-h-[700px] bg-[#121212] sm:rounded-2xl shadow-2xl shadow-amber-900/20 flex flex-col sm:border border-amber-800/20">
        <!-- Cabeçalho -->
        <header class="p-4 border-b border-amber-800/30 flex items-center space-x-4 flex-shrink-0">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-600 to-amber-800 flex items-center justify-center">
                <span class="text-2xl font-bold text-black">S.</span>
            </div>
            <div>
                <h1 class="text-xl font-bold text-amber-400 solia-glow">Sol.IA</h1>
                <p class="text-sm text-green-400 flex items-center">
                    <span class="w-2 h-2 bg-green-400 rounded-full mr-2 animate-pulse"></span>
                    Online
                </p>
            </div>
        </header>
        <!-- Área de Chat -->
        <main id="chat-container" class="flex-1 p-6 overflow-y-auto chat-container space-y-6">
        </main>
        <!-- Indicador de 'digitando...' -->
        <div id="typing-indicator" class="px-6 pb-2 hidden flex-shrink-0">
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
                <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
            </div>
        </div>
        <!-- Área de Input -->
        <footer class="p-4 border-t border-amber-800/30 flex-shrink-0">
            <div class="bg-[#1f1f1f] rounded-lg flex items-end p-2">
                <textarea id="user-input" class="w-full bg-transparent p-2 focus:outline-none text-gray-200 placeholder-gray-500 resize-none" placeholder="Qual a nossa missão hoje?" rows="1" style="max-height: 120px;"></textarea>
                <button id="upload-btn" class="p-2 text-gray-400 hover:text-amber-400 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-paperclip">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <button id="audio-btn" class="p-2 text-gray-400 hover:text-amber-400 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-mic">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <button id="send-btn" class="p-3 bg-amber-500 text-black rounded-full hover:bg-amber-400 transition-colors disabled:bg-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-up">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </footer>
    </div>
    <script>
        // Registro do Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => console.log('Service Worker registado com sucesso:', registration))
                    .catch(error => console.log('Falha no registo do Service Worker:', error));
            });
        }

        // Lógica da aplicação de chat
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const uploadBtn = document.getElementById('upload-btn');
        const audioBtn = document.getElementById('audio-btn');

        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = `${userInput.scrollHeight}px`;
        });

        uploadBtn.addEventListener('click', () => {
            console.log('Botão de upload clicado');
            // Placeholder for upload functionality
        });

        audioBtn.addEventListener('click', () => {
            console.log('Botão de áudio clicado');
            // Placeholder for audio recording functionality
        });

        const STORAGE_KEY = 'sol-ia-username';
        let persistentStorage = null;
        try {
            persistentStorage = window.localStorage;
            const testKey = '__solia-test__';
            persistentStorage.setItem(testKey, testKey);
            persistentStorage.removeItem(testKey);
        } catch (error) {
            console.warn('LocalStorage indisponível, dados vão ser mantidos apenas durante a sessão.', error);
            persistentStorage = null;
        }

        let userName = persistentStorage ? persistentStorage.getItem(STORAGE_KEY) : null;
        let databaseInitialized = !!userName;

        const renderMessage = (sender, message) => {
            const messageWrapper = document.createElement('div');
            messageWrapper.classList.add('flex', 'w-full', sender === 'user' ? 'justify-end' : 'justify-start');
            messageWrapper.style.opacity = '0';
            messageWrapper.style.transform = 'translateY(20px)';
            messageWrapper.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            const messageBubble = document.createElement('div');
            messageBubble.classList.add('max-w-md', 'p-4', 'rounded-2xl');
            if (sender === 'user') {
                messageBubble.classList.add('bg-amber-800/50', 'text-white', 'rounded-br-none');
            } else {
                messageBubble.classList.add('bg-[#2a2a2a]', 'text-gray-200', 'rounded-bl-none');
            }
            messageBubble.innerHTML = message.replace(/\n/g, '<br>');
            messageWrapper.appendChild(messageBubble);
            chatContainer.appendChild(messageWrapper);
            setTimeout(() => {
                messageWrapper.style.opacity = '1';
                messageWrapper.style.transform = 'translateY(0)';
            }, 10);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        const handleConversation = async (userMessage) => {
            if (!userMessage.trim()) return;
            renderMessage('user', userMessage);
            userInput.value = '';
            userInput.style.height = 'auto';
            typingIndicator.classList.remove('hidden');

            try {
                const response = await fetch('http://localhost:3001/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: userMessage, userName: userName }),
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => (null));
                    const errorMessage = errorData?.error || 'A resposta do servidor não foi OK.';
                    throw new Error(errorMessage);
                }

                const data = await response.json();
                const aiResponse = data.response;

                typingIndicator.classList.add('hidden');
                renderMessage('ai', aiResponse);

            } catch (error) {
                console.error('Erro ao buscar resposta da IA:', error);
                typingIndicator.classList.add('hidden');
                renderMessage('ai', `Desculpe, não consegui me conectar ao meu cérebro. Verifique se o servidor backend está rodando e tente novamente. (Erro: ${error.message})`);
            }
        };

        sendBtn.addEventListener('click', () => handleConversation(userInput.value));
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleConversation(userInput.value);
            }
        });

        const startConversation = () => {
            let initialMessage;
            if (databaseInitialized) {
                initialMessage = `Sol.IA reativada. Banco de Dados de ${userName} carregado. Pronta para transformar tensão em poder. Qual a missão de hoje?`;
            } else {
                initialMessage = "Sol.IA ativada. Arquitetura da Influência carregada.\nMeu sistema de memória está pronto para ser personalizado. Para iniciarmos nosso trabalho, por favor, diga-me o seu nome para que eu possa criar o seu Banco de Dados Dinâmico e exclusivo.";
            }
            renderMessage('ai', initialMessage);
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startConversation);
        } else {
            startConversation();
        }
    </script>
</body>
</html>
